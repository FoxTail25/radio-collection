version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radio-app
    restart: unless-stopped
    volumes:
      # МОНТИРУЕМ БАЗУ ДАННЫХ: теперь файл на сервере свяжется с файлом в контейнере и не сотрется!
      - /var/www/radio-player-db/database.sqlite:/var/www/database/database.sqlite
    environment:
      - APP_ENV=production
      - APP_DEBUG=false

  web:
    image: nginx:alpine
    container_name: radio-web
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./:/etc/nginx/conf.d/
    depends_on:
      - app
