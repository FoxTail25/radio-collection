version: '3.8'

services:
  web-app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:80" # Твой сайт будет доступен на 8080 порту VDS
    volumes:
      - app_storage:/var/www/storage
      - app_database:/var/www/database # Важно! Сохраняем базу данных SQLite при обновлениях кода

volumes:
  app_storage:
  app_database:
